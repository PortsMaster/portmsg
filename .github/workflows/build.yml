name: portmsg Build & Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------
  # JOB 1: Build all architectures in Debian Bullseye (glibc 2.31)
  # ----------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye
    name: Debian ${{ matrix.arch.name }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: arm64
            executable: aarch64
            gcc: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
          - name: armhf
            executable: armhf
            gcc: gcc-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            strip: arm-linux-gnueabihf-strip
          - name: amd64
            executable: x86_64
            gcc: gcc
            cc: gcc
            strip: strip

    steps:
      - name: Install ${{ matrix.arch.name }} dependencies
        run: |
          # Bullseye has moved to archive.debian.org; deb.debian.org no longer serves its security updates.
          sed -i -e 's|deb.debian.org|archive.debian.org|g' -e 's|security.debian.org|archive.debian.org|g' /etc/apt/sources.list
          dpkg --add-architecture ${{ matrix.arch.name }}
          apt update
          apt install -y --no-install-recommends build-essential xxd ca-certificates git ${{ matrix.arch.gcc }} libsdl2-dev:${{ matrix.arch.name }}

      - uses: actions/checkout@v4

      - name: Build ${{ matrix.arch.name }}
        run: |
          make ARCH=${{ matrix.arch.executable }} CC=${{ matrix.arch.cc }} STRIP=${{ matrix.arch.strip }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portmsg_${{ matrix.arch.name }}
          path: |
            ${{ github.workspace }}/portmsg.${{ matrix.arch.executable }}

  # ----------------------------------------------------------------
  # JOB 2: Package (Runs on all builds) & Release (Manual Only)
  # ----------------------------------------------------------------
  package:
    needs: [build]
    runs-on: ubuntu-latest
    name: Package Artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for changelog generation

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate
        run: |
          mkdir staging
          cp artifacts/portmsg_arm64/* staging/
          cp artifacts/portmsg_armhf/* staging/
          cp artifacts/portmsg_amd64/* staging/
          mkdir staging/licenses
          cp LICENSE staging/licenses/LICENSE-portmsg.txt
          cp fonts/OFL.txt staging/licenses/LICENSE-portmsg-sans.txt
          chmod +x staging/portmsg.*

          echo "Staging contents:"
          ls -R staging

      - name: Create Zip Archive for Release
        run: |
          cd staging
          zip -r ../portmsg-all.zip ./*

      - name: Upload Consolidated Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portmsg-complete-bundle
          path: staging/*

      # ----------------------------------------------------------------
      # The following steps ONLY run if manually triggered (workflow_dispatch)
      # ----------------------------------------------------------------

      - name: Generate Version and Changelog
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(date +'%Y.%m.%d-%H%M')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            echo "## Initial Release or No Tags Found" > release_notes.txt
            echo "" >> release_notes.txt
            git log -n 10 --pretty=format:"- %h %s" >> release_notes.txt
          else
            echo "## Changes since $LAST_TAG" > release_notes.txt
            echo "" >> release_notes.txt
            git log ${LAST_TAG}..HEAD --pretty=format:"- %h %s" >> release_notes.txt
          fi

          cat release_notes.txt

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.VERSION }} \
            portmsg-all.zip \
            staging/portmsg.aarch64 \
            staging/portmsg.armhf \
            staging/portmsg.x86_64 \
            --title "portmsg ${{ env.VERSION }}" \
            --notes-file release_notes.txt \
            --target ${{ github.sha }}
